name: Verify real Phonon speech in Chromium
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/speech-smoke.yml
      - tests/phonon-smoke.mjs
permissions:
  contents: read
jobs:
  browser-synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Synthesize real Phonon narration in Chrome
        run: node tests/phonon-smoke.mjs
