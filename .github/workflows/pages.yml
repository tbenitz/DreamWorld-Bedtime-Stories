name: Deploy DreamWorld (Phonon runtime included)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Mirror official Phonon worker and WASM into the repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          rm -rf vendor/phonon
          cp -a node_modules/phonon-tts vendor/phonon
          test -s vendor/phonon/index.js
          test -s vendor/phonon/worker.js
          find vendor/phonon -name '*.wasm' | grep -q .
          git add -f vendor/phonon
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Bundle Phonon browser worker and WASM for both Pages sources"
            git push origin HEAD:main
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify live Phonon files, WASM, and voice catalog
        shell: bash
        run: |
          set -euo pipefail
          base="https://tbenitz.github.io/DreamWorld-Bedtime-Stories"
          for path in vendor/phonon/index.js vendor/phonon/worker.js vendor/phonon/wasm/phonon_tts_bg.wasm voices.json; do
            url="$base/$path"
            echo "Checking $url"
            curl --fail --location --silent --show-error --retry 10 --retry-all-errors --retry-delay 4 --output /tmp/dreamworld-asset "$url"
            test -s /tmp/dreamworld-asset
            echo "OK $path ($(wc -c < /tmp/dreamworld-asset) bytes)"
          done
